<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calorie Counter · Sign in</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card card">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span><span data-app-name>Calorie Counter</span></h1>
    <p class="muted">Track what you eat, one day at a time.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" data-mode="login" aria-selected="true">Sign in</button>
      <button type="button" role="tab" class="tab" data-mode="register" aria-selected="false">Create account</button>
    </div>

    <form id="auth-form" novalidate>
      <label>Username
        <input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required minlength="8">
      </label>
      <p id="auth-hint" class="hint" hidden>3–32 letters, numbers or underscores. Password at least 8 characters.</p>
      <p id="auth-message" class="message" hidden></p>
      <button type="submit" class="btn primary block" id="auth-submit">Sign in</button>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
