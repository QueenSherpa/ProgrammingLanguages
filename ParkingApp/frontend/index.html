<h1>Parking Availability App</h1><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parking Availability App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Parking Availability App</h1>

<div id="login-panel">
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="login-btn">Sign In</button>
  <p id="login-status"></p>
</div>

<div id="user-info" style="display:none;">
  Logged in as <span id="current-username"></span> (<span id="current-role"></span>)
  <button id="logout-btn">Log Out</button>
</div>

<div id="lots-panel">
  <h2>Parking Lots</h2>
  <ul id="lots-list"></ul>
</div>

<div id="admin-panel" style="display:none;">
  <h2>Admin Controls</h2>
  <div id="admin-lots-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
