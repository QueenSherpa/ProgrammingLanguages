services:
  db:
    image: postgres:16
    container_name: parking-db
    environment:
      POSTGRES_USER: parkingadmin
      POSTGRES_PASSWORD: parkingPass2026
      POSTGRES_DB: parkingapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
