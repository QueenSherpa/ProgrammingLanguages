name: Calorie Counter CI

on:
  push:
    paths:
      - "Calorie Counter/**"
      - ".github/workflows/calorie-counter.yml"
  pull_request:
    paths:
      - "Calorie Counter/**"
      - ".github/workflows/calorie-counter.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Calorie Counter/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorie
          POSTGRES_PASSWORD: calorie
          POSTGRES_DB: calorie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorie -d calorie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://calorie:calorie@localhost:5432/calorie_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Calorie Counter/backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-image:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t calorie-counter-backend "Calorie Counter/backend"

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check frontend scripts
        working-directory: Calorie Counter/frontend/public/js
        run: for f in *.js; do node --check "$f"; done
      - name: Build frontend image
        run: docker build -t calorie-counter-frontend "Calorie Counter/frontend"

  stack-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-check]
    defaults:
      run:
        working-directory: Calorie Counter
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "auth-form"
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
          curl -fsS http://localhost:8080/api/theme | grep -q appName
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke_user","password":"smoke-pass-123"}' | jq -r .token)
          curl -fsS -X POST http://localhost:8080/api/entries \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"food":"Banana","calories":105}' | grep -q Banana
          ADMIN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin12345"}' | jq -r .token)
          curl -fsS http://localhost:8080/api/admin/users -H "Authorization: Bearer $ADMIN" | grep -q smoke_user
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
